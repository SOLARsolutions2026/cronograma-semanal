<style id="sheet-css">
/* Hoja institucional: documento en papel blanco (igual en pantalla y en PDF). Membrete con logos, título y ficha; banda corporativa; rejilla por día; pie. */
.hoja{
  --navy:#28346d; --navy-osc:#1b244f; --azul:#2f5fcf; --ambar:#f5b00e; --naranja:#f6922a; --naranja-txt:#a85606;
  --tinta:#1a2238; --gris:#4a5470; --gris-2:#6a7389; --linea:#d3d9e6; --papel:#ffffff; --tinte:#f3f5fa;
  --verde-bg:#e6f4e3; --verde:#1c6a2b; --verde-linea:#c2e3bc; --azul-bg:#e6eefc; --azul-txt:#1f4fb0; --azul-linea:#c5d7f7;
  --hecho-bg:#d8eed5; --hecho:#145021; --hecho-linea:#a9d6a1; --repro-bg:#fff1df; --repro:#8f4a00; --repro-linea:#f3cf9f;
  --cancel-bg:#eef0f4; --cancel:#4d5566; --cancel-linea:#d4d8e0; --borde-campo:#c9a36b;
  --f-display:"Barlow Semi Condensed","Arial Narrow","Segoe UI",Arial,sans-serif;
  --f-texto:"Source Sans 3","Segoe UI",Arial,sans-serif;
  position:relative; background:var(--papel); color:var(--tinta);
  font-family:var(--f-texto); font-size:15px; line-height:1.4;
  border:1px solid var(--linea); border-radius:6px; overflow:hidden; color-scheme:light;
  box-shadow:0 1px 2px rgba(27,36,79,.06),0 10px 30px rgba(27,36,79,.10);
}
.hoja *{box-sizing:border-box}
.hoja .cab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 28px;align-items:center;padding:20px 26px 18px}
.hoja .logos{display:flex;align-items:center;gap:18px}
.hoja .logos img{display:block;height:auto;max-width:100%}
.hoja .logo-pe{width:98px}
.hoja .logo-ss{width:158px}
.hoja .sep{width:1px;align-self:stretch;min-height:64px;background:var(--linea)}
.hoja .titulos{min-width:0}
.hoja .t1{font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:clamp(25px,2.7vw,37px);line-height:1.05;letter-spacing:.045em;margin:0;text-wrap:balance}
.hoja .t2{font-family:var(--f-display);font-weight:600;color:var(--naranja-txt);font-size:clamp(15px,1.5vw,20px);letter-spacing:.07em;margin:5px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .45em;text-transform:uppercase}
.hoja .campo{font:inherit;color:inherit;letter-spacing:inherit;background:transparent;border:0;border-bottom:1.5px dashed var(--borde-campo);padding:0 2px;min-width:4ch;max-width:100%;border-radius:0}
.hoja .t2 .campo{text-transform:uppercase}
.hoja .campo:focus{outline:3px solid var(--naranja);outline-offset:2px;border-bottom-color:transparent}
.hoja .ficha{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;border:1px solid var(--linea);background:var(--tinte);border-radius:4px;padding:10px 14px;font-size:13.5px;max-width:330px;font-variant-numeric:tabular-nums}
.hoja .ficha dt{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris-2)}
.hoja .ficha dd{margin:0;font-weight:600;color:var(--navy);min-width:0;overflow-wrap:anywhere}
.hoja .ficha .campo{width:100%;font-weight:600}
.hoja .banda{height:8px;background:linear-gradient(108deg,var(--navy) 0 76%,var(--papel) 76% 77%,var(--ambar) 77% 88%,var(--papel) 88% 89%,var(--naranja) 89%)}
.hoja .resumen{margin:0;padding:9px 26px;background:var(--tinte);border-bottom:1px solid var(--linea);display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;font-size:13.5px;color:var(--gris)}
.hoja .resumen b{color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
.hoja .resumen .sp{flex:1 1 auto}
.hoja .cuerpo{padding:16px 26px 18px}

.hoja .rejilla-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.hoja .rejilla{display:grid;grid-template-columns:repeat(var(--n,5),minmax(168px,1fr));gap:10px;min-width:calc(var(--n,5) * 178px)}
.hoja .col{display:flex;flex-direction:column;gap:8px;min-width:0;scroll-margin-top:130px}
.hoja .dh{background:var(--navy);color:#fff;border-radius:4px;text-align:center;padding:8px 6px 7px;border:2px solid var(--navy)}
.hoja .dh .dn{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.1em}
.hoja .dh .dd{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;opacity:.9;font-variant-numeric:tabular-nums}
.hoja .dh.hoy{border-color:var(--ambar);box-shadow:inset 0 -3px 0 var(--ambar)}
.hoja .acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hoja .act{background:var(--papel);border:1px solid var(--linea);border-radius:4px;padding:10px 12px;break-inside:avoid;page-break-inside:avoid}
.hoja .act-h{margin:0 0 5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;font-weight:600;color:var(--gris);font-variant-numeric:tabular-nums}
.hoja .jor{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--tinte);border:1px solid var(--linea);border-radius:3px;padding:1px 7px}
.hoja .act-t{font-family:var(--f-texto);font-weight:700;color:var(--navy);font-size:15.5px;line-height:1.22;margin:0 0 3px;overflow-wrap:anywhere}
.hoja .act-d{margin:0 0 8px;font-size:13.5px;color:var(--gris);white-space:pre-line;overflow-wrap:anywhere}
.hoja .resp{margin:0 0 9px;padding:7px 0 0;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:5px}
.hoja .resp dt{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris-2)}
.hoja .resp dd{margin:0;font-size:13.5px;color:var(--tinta);overflow-wrap:anywhere}
.hoja .resp dd.jefe{font-weight:700;color:var(--navy)}
.hoja .act-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hoja .tag{display:inline-block;border-radius:3px;padding:2px 9px;font-weight:700;font-size:12.5px;color:#fff;border:1.5px solid transparent}
.hoja .tag--azul{background:var(--azul);border-color:var(--azul)}
.hoja .tag--naranja{background:var(--naranja);border-color:var(--naranja);color:var(--navy-osc)}
.hoja .st{display:inline-block;border-radius:3px;padding:2px 9px;font-weight:700;font-size:12.5px;border:1px solid transparent}
.hoja .st--programado{background:var(--verde-bg);color:var(--verde);border-color:var(--verde-linea)}
.hoja .st--ejecucion{background:var(--azul-bg);color:var(--azul-txt);border-color:var(--azul-linea)}
.hoja .st--ejecutado{background:var(--hecho-bg);color:var(--hecho);border-color:var(--hecho-linea)}
.hoja .st--reprogramado{background:var(--repro-bg);color:var(--repro);border-color:var(--repro-linea)}
.hoja .st--cancelado{background:var(--cancel-bg);color:var(--cancel);border-color:var(--cancel-linea);text-decoration:line-through}
.hoja .vacio{border:1px dashed var(--linea);border-radius:4px;padding:13px 8px;text-align:center;color:var(--gris-2);font-size:13px}
.hoja .pie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:11px 26px;border-top:1px solid var(--linea);color:var(--gris);font-size:13px}
.hoja .pie .nota{flex:1 1 320px;min-width:0}
.hoja .pie .campo{width:100%}
.hoja .pie .firma{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--navy)}

@media (max-width:860px){
  .hoja .cab{grid-template-columns:auto minmax(0,1fr)}
  .hoja .ficha{grid-column:1 / -1;max-width:none}
}
@media (max-width:720px){
  .hoja{border-radius:0;border-inline:0}
  .hoja .cab{grid-template-columns:minmax(0,1fr);padding:16px 16px 14px;gap:12px}
  .hoja .logo-pe{width:74px}.hoja .logo-ss{width:124px}.hoja .sep{min-height:50px}
  .hoja .resumen{padding:9px 16px}
  .hoja .cuerpo{padding:14px 16px 16px}
  .hoja .pie{padding:11px 16px}
  .hoja .rejilla-scroll{overflow:visible}
  .hoja .rejilla{grid-template-columns:minmax(0,1fr);min-width:0;gap:16px}
  .hoja .dh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;text-align:left}
  .hoja .act{padding:12px 14px}
  .hoja .act-t{font-size:16.5px}.hoja .act-d,.hoja .resp dd{font-size:14.5px}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff!important}
  .hoja{box-shadow:none;border:0;border-radius:0;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hoja .cab{grid-template-columns:auto minmax(0,1fr) auto;padding:0 0 10px;gap:10px 22px;break-after:avoid}
  .hoja .ficha{grid-column:auto;max-width:300px;font-size:11.5px;padding:7px 11px}
  .hoja .ficha dt{font-size:9.5px}
  .hoja .logo-pe{width:74px}.hoja .logo-ss{width:122px}.hoja .sep{min-height:52px}
  .hoja .t1{font-size:27px}.hoja .t2{font-size:15px}
  .hoja .campo{border:0;padding:0}
  .hoja .banda{height:6px}
  .hoja .resumen{padding:6px 2px;font-size:11.5px;background:transparent}
  .hoja .cuerpo{padding:10px 0 8px}
  .hoja .rejilla-scroll{overflow:visible;margin:0;padding:0}
  .hoja .rejilla{min-width:0;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px}
  .hoja .dh{display:block;text-align:center;padding:5px 4px}
  .hoja .dh.hoy{border-color:var(--navy);box-shadow:none}
  .hoja .dh .dn{font-size:13.5px}.hoja .dh .dd{font-size:11px}
  .hoja .acts{gap:6px}
  .hoja .act{padding:7px 8px}
  .hoja .act-t{font-size:12.5px}.hoja .act-d,.hoja .resp dd{font-size:11.5px}.hoja .act-h{font-size:11px}
  .hoja .jor{font-size:9.5px}.hoja .resp dt{font-size:9px}
  .hoja .tag,.hoja .st{font-size:10.5px;padding:1px 7px}
  .hoja .vacio{visibility:hidden}
  .hoja .pie{padding:7px 0 0;font-size:11px}
  .hoja .pie .firma{font-size:10px}
  .no-print{display:none!important}
}
</style>
<style>
/* Interfaz de la aplicación: barra corporativa azul marino (igual en claro y oscuro), barra de semana fija y diálogos. */
:root{
  --bg:#e9ecf3; --panel:#ffffff; --fg:#1a2238; --muted:#56607a; --borde:#d0d6e3;
  --acento:#28346d; --acento-fg:#ffffff; --acento-suave:#e6eaf6; --peligro:#b42318; --peligro-fg:#ffffff; --peligro-suave:#fdecea;
  --aviso:#8f4a00; --foco:#f6922a; --velo:rgba(12,17,38,.6);
  --barra:#1b244f; --barra-2:#28346d; --barra-fg:#ffffff; --barra-tenue:#c5cdea; --barra-linea:rgba(255,255,255,.26); --barra-relleno:rgba(255,255,255,.09);
  --ambar:#f5b00e; --ambar-fg:#1b244f; --ok-barra:#86e196; --err-barra:#ffa59c; --warn-barra:#ffcb7a;
  --f-ui:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-tit:"Barlow Semi Condensed","Arial Narrow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1122; --panel:#161e36; --fg:#e6ebf5; --muted:#a3adc4; --borde:#2c3856;
  --acento:#8eaaf5; --acento-fg:#0c1122; --acento-suave:#1e2a4c; --peligro:#ff8a80; --peligro-fg:#2a0d0b; --peligro-suave:#3a1d1f;
  --aviso:#ffb766; --foco:#ffb04d; --velo:rgba(0,0,0,.66);
  --barra:#141b3d; --barra-2:#1f2957; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1122; --panel:#161e36; --fg:#e6ebf5; --muted:#a3adc4; --borde:#2c3856;
  --acento:#8eaaf5; --acento-fg:#0c1122; --acento-suave:#1e2a4c; --peligro:#ff8a80; --peligro-fg:#2a0d0b; --peligro-suave:#3a1d1f;
  --aviso:#ffb766; --foco:#ffb04d; --velo:rgba(0,0,0,.66);
  --barra:#141b3d; --barra-2:#1f2957; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%}
.lienzo{max-width:1480px;width:100%;margin:0 auto;padding-inline:16px;padding-block:16px 36px;display:flex;flex-direction:column;gap:12px}

.appbar{position:relative;z-index:25;background:var(--barra);color:var(--barra-fg);color-scheme:dark;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ab-marca{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ab-t{font-family:var(--f-tit);font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:18px;line-height:1.15}
.estado{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--barra-tenue)}
.estado::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.estado.ok{color:var(--ok-barra)}.estado.err{color:var(--err-barra)}.estado.warn{color:var(--warn-barra)}
.bb{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--barra-linea);background:var(--barra-relleno);color:var(--barra-fg);border-radius:6px;padding:7px 12px;font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap;min-height:36px}
.bb:hover{border-color:var(--barra-fg)}
.bb:disabled{opacity:.5;cursor:not-allowed}
.bb-pri{background:var(--ambar);border-color:var(--ambar);color:var(--ambar-fg)}
.bb-pri:hover{border-color:var(--barra-fg)}
.seg{display:inline-flex;border:1px solid var(--barra-linea);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--barra-fg);padding:7px 12px;font-weight:600;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--barra-fg);color:var(--barra)}
.solo-lectura{font-size:13px;font-weight:600;color:var(--barra-tenue)}
.menu{position:absolute;right:16px;top:calc(100% - 4px);z-index:30;background:var(--panel);color:var(--fg);border:1px solid var(--borde);border-radius:8px;box-shadow:0 12px 34px rgba(12,17,38,.28);min-width:250px;padding:6px;display:flex;flex-direction:column;gap:2px}
.menu button,.menu label{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);text-align:left;padding:10px 12px;border-radius:6px;font-weight:600;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--acento-suave)}
.menu hr{border:0;border-top:1px solid var(--borde);margin:4px 0;width:100%}
.menu .pel{color:var(--peligro)}

.sembar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--barra-2);color:var(--barra-fg);color-scheme:dark;padding:8px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(12,17,38,.22)}
.sem-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.campo-sem{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--barra-tenue);font-size:13.5px}
.campo-sem input{border:1px solid var(--barra-linea);background:var(--barra-relleno);color:var(--barra-fg);border-radius:6px;padding:6px 8px;min-height:36px;font-weight:600}
.aviso-sem{font-size:13px;color:var(--warn-barra)}
.dias-nav{display:none}
.dias-nav button{flex:1 1 0;min-width:0;border:1px solid var(--barra-linea);background:var(--barra-relleno);color:var(--barra-fg);border-radius:6px;padding:4px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;position:relative}
.dias-nav .d1{font-family:var(--f-tit);font-weight:600;font-size:11.5px;letter-spacing:.08em;color:var(--barra-tenue)}
.dias-nav .d2{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.dias-nav .hay{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ambar)}
.dias-nav .es-hoy{border-color:var(--ambar)}
.txt-c{display:none}

.msg{margin:0;font-size:14px;border-radius:6px;padding:9px 12px;background:var(--acento-suave);color:var(--fg);border:1px solid var(--borde)}
.msg.err{background:var(--peligro-suave);color:var(--peligro)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);background:var(--panel);color:var(--fg);border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:600;line-height:1.2;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--acento)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--acento);color:var(--acento-fg);border-color:var(--acento)}
.btn-pel{background:var(--peligro);color:var(--peligro-fg);border-color:var(--peligro)}
.btn-txt{border-color:transparent;background:transparent;color:var(--acento)}

/* Controles dentro de la hoja (solo en edición) */
.hoja .act-ctl{display:flex;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid var(--linea);flex-wrap:wrap}
.hoja .mini{border:1px solid var(--linea);background:var(--papel);color:var(--navy);border-radius:4px;padding:4px 7px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.3;min-height:30px}
.hoja .mini:hover{border-color:var(--navy);background:var(--tinte)}
.hoja .mini:disabled{opacity:.35;cursor:default;background:var(--papel)}
.hoja .mini.del{color:#b42318;margin-left:auto}
.hoja .add{border:1.5px dashed #9aa6c8;background:var(--tinte);color:var(--navy);border-radius:4px;padding:9px;font-weight:700;cursor:pointer;width:100%;min-height:40px}
.hoja .add:hover{border-color:var(--navy)}
.hoja .oculto-sab{font-size:13px;color:var(--repro);margin:0 0 12px}
.cargando{padding:44px;text-align:center;color:#4a5470}

/* Diálogos */
.velo{position:fixed;inset:0;background:var(--velo);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50}
.dlg{background:var(--panel);color:var(--fg);border-radius:10px;width:100%;max-width:600px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--borde);display:flex;flex-direction:column;overflow:hidden}
.dlg>form{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.dlg header{padding:14px 20px;background:var(--barra);color:var(--barra-fg)}
.dlg h2{margin:0;font-family:var(--f-tit);font-size:18px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.dlg .cuerpo{padding:16px 20px 6px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.dlg .pie-dlg{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--borde)}
.dlg p{margin:0}
.grupo{font-family:var(--f-tit);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px;padding-bottom:5px;border-bottom:1px solid var(--borde)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;padding:0;margin:0}
.f label,.f legend{font-weight:700;font-size:14px;padding:0}
.f .opc{font-weight:400;color:var(--muted)}
.f input:not([type=radio]):not([type=checkbox]),.f select,.f textarea{border:1px solid var(--borde);background:var(--panel);color:var(--fg);border-radius:6px;padding:9px 10px;width:100%;min-height:40px}

.f [aria-invalid="true"]{border-color:var(--peligro);box-shadow:0 0 0 1px var(--peligro)}

.f .ayuda{font-size:13px;color:var(--muted)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.pildoras{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pildoras label{position:relative;font-weight:600;cursor:pointer}
.pildoras input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pildoras span{display:inline-flex;align-items:center;border:1px solid var(--borde);border-radius:6px;padding:8px 13px;min-height:38px;background:var(--panel)}
.pildoras input:checked+span{background:var(--acento);border-color:var(--acento);color:var(--acento-fg)}
.pildoras input:focus-visible+span{outline:3px solid var(--foco);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip{display:inline-flex;align-items:center;gap:4px;background:var(--acento-suave);border:1px solid var(--borde);border-radius:6px;padding:4px 4px 4px 10px;font-weight:600;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.chip button{border:0;background:transparent;color:var(--fg);cursor:pointer;font-size:17px;line-height:1;padding:3px 7px;border-radius:4px}

.fila-op{display:flex;gap:8px}
.fila-op input{flex:1;min-width:0}
.suger{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.suger:empty{display:none}
.suger button{border:1px dashed var(--borde);background:transparent;color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13.5px}

.nota-dlg{font-size:13.5px;color:var(--muted)}
.sucio{background:var(--peligro-suave);color:var(--peligro);border-radius:6px;padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600}
textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:180px}

  .seg{flex:1 1 auto}.seg button{flex:1 1 0}

  .sem-nav{flex-wrap:nowrap}
  .campo-sem{flex:1 1 auto;min-width:0}

  .campo-sem input{width:100%;min-width:0}
  .txt-l{display:none}.txt-c{display:inline}
  .dias-nav{display:flex;gap:5px}
  .menu{right:12px;left:12px}
  .velo{align-items:flex-end;padding:0}

  .hoja .mini{padding:6px 12px;min-height:36px}

}

<script id="modulo-fechas">
/* ===== 1. Cálculo de fechas (calendario local, sin UTC) ===== */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_ABR=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DIAS=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const DIAS_C=['LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const DIAS_T=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const p2=n=>String(n).padStart(2,'0');
/* Mediodía local: evita saltos de día por horario de verano */
function fechaLocal(y,m,d){return new Date(y,m,d,12,0,0,0)}
function hoy(){const n=new Date();return fechaLocal(n.getFullYear(),n.getMonth(),n.getDate())}
function sumarDias(f,n){return fechaLocal(f.getFullYear(),f.getMonth(),f.getDate()+n)}
function lunesDe(f){const d=f.getDay();return sumarDias(f,d===0?-6:1-d)}
function aClave(f){return f.getFullYear()+'-'+p2(f.getMonth()+1)+'-'+p2(f.getDate())}
function deClave(k){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k||'');if(!m)return null;const f=fechaLocal(+m[1],+m[2]-1,+m[3]);return aClave(f)===k?f:null}
function textoLargo(f){return f.getDate()+' de '+MESES[f.getMonth()]+' de '+f.getFullYear()}
function textoRango(lunes,n){return 'Semana del '+textoLargo(lunes)+' al '+textoLargo(sumarDias(lunes,n-1))}
function textoCorto(f){return p2(f.getDate())+' '+MES_ABR[f.getMonth()]}
function textoNum(f){return p2(f.getDate())+'/'+p2(f.getMonth()+1)+'/'+f.getFullYear()}
</script>

const RE_HORA=/^([01]\d|2[0-3]):[0-5]\d$/;

const S={

function nuevoId(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function claveActual(){return aClave(S.lunes)}
function numDias(){return S.doc.incluirSabado?6:5}
function actsDe(clave){return S.semanas[clave]||[]}
/* Lista de nombres sin vacíos ni repetidos (se comparan sin distinguir mayúsculas) */
function limpiarNombres(v){
  const lista=Array.isArray(v)?v:typeof v==='string'?v.split(/[,;\n]/):[];
  const vistos=new Set(),r=[];
  for(const x of lista){if(typeof x!=='string')continue;const n=x.replace(/\s+/g,' ').trim().slice(0,60);if(!n)continue;const k=n.toLocaleLowerCase('es');if(vistos.has(k))continue;vistos.add(k);r.push(n);if(r.length>=40)break}
  return r;
}
/* Normaliza/valida una actividad (formulario, base de datos o respaldo). Devuelve null si no es válida. */
function limpiarActividad(a){
  if(!a||typeof a!=='object')return null;
  const titulo=typeof a.titulo==='string'?a.titulo.trim():'';
  const dia=Number(a.dia);
  if(!titulo||!Number.isInteger(dia)||dia<0||dia>5)return null;
  const ini=typeof a.inicio==='string'&&RE_HORA.test(a.inicio)?a.inicio:'';
  const fin=typeof a.fin==='string'&&RE_HORA.test(a.fin)?a.fin:'';
  if(ini&&fin&&fin<=ini)return null;
  return {id:typeof a.id==='string'&&a.id?a.id:nuevoId(),dia,titulo:titulo.slice(0,200),
    jornada:JORNADAS[a.jornada]?a.jornada:'',inicio:ini,fin,
    descripcion:typeof a.descripcion==='string'?a.descripcion.slice(0,2000):'',
    jefe:typeof a.jefe==='string'?a.jefe.replace(/\s+/g,' ').trim().slice(0,80):'',
    operarios:limpiarNombres(a.operarios),
    etiqueta:typeof a.etiqueta==='string'?a.etiqueta.trim().slice(0,40):'',
    color:COLORES[a.color]?a.color:'azul',estado:ESTADOS[a.estado]?a.estado:'programado',orden:0};
}
/* Recalcula el campo orden por día sin reordenar (se respeta el orden manual) */
function numerar(lista){const c=[0,0,0,0,0,0];lista.forEach(a=>{a.orden=c[a.dia]++});return lista}
function limpiarDoc(d){d=d&&typeof d==='object'?d:{};return{
  division:typeof d.division==='string'?d.division.slice(0,80):DOC_BASE.division,
  proyecto:typeof d.proyecto==='string'?d.proyecto.slice(0,120):DOC_BASE.proyecto,
  nota:typeof d.nota==='string'?d.nota.slice(0,300):DOC_BASE.nota,
  elaboro:typeof d.elaboro==='string'?d.elaboro.slice(0,80):'',
  incluirSabado:!!d.incluirSabado}}
/* Nombres ya usados en cualquier semana, para sugerirlos en el formulario */
function nombresUsados(){
  const j=new Map(),o=new Map();
  for(const k of Object.keys(S.semanas))for(const a of S.semanas[k]){
    if(a.jefe)j.set(a.jefe.toLocaleLowerCase('es'),a.jefe);
    for(const n of a.operarios)o.set(n.toLocaleLowerCase('es'),n);
  }
  const ord=m=>[...m.values()].sort((x,y)=>x.localeCompare(y,'es'));
  return{jefes:ord(j),operarios:ord(o)};
}

<script>
/* ===== 3. Persistencia y respaldos ===== */
const Almacen={
  modo:'cargando', db:null, descargas:null, independiente:!(window.claude&&typeof window.claude.use==='function'),
  async iniciar(){
    let db=null,usuario=null;
    if(!this.independiente){try{[db,usuario,this.descargas]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')])}catch(e){db=null}}
    if(db){
      this.db=db; this.modo='db';
      let puede=null; try{puede=usuario?await usuario.can('data.write'):null}catch(e){}
      S.puedeEditar=puede!==false;
      await this.suscribir();
      return;
    }
    try{
      const raw=localStorage.getItem(LS_CLAVE);
      localStorage.setItem(LS_CLAVE+':prueba','1');localStorage.removeItem(LS_CLAVE+':prueba');
      this.modo='local';
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
      if(raw){const d=JSON.parse(raw);S.doc=limpiarDoc(d.documento);S.semanas=this.limpiarSemanas(d.semanas)}
      else if(this.independiente){S.doc=limpiarDoc(SEMILLA.documento);S.semanas=this.limpiarSemanas(SEMILLA.semanas)}
    }catch(e){this.modo='memoria'}
  },
  suscribir(){
    return new Promise(res=>{
      let listoDoc=false,listoSem=false; const fin=()=>{if(listoDoc&&listoSem)res()};
      this.db.doc('config/documento').onSnapshot(s=>{
        if(s.exists)S.doc=limpiarDoc(s.data()); listoDoc=true; fin(); if(S.cargado)pintar();
      },e=>this.errorEscucha(e));
      this.db.collection('semanas').onSnapshot(q=>{
        const nuevas={};
        q.docs.forEach(d=>{if(deClave(d.id)){const acts=(d.data().actividades||[]).map(limpiarActividad).filter(Boolean);if(acts.length)nuevas[d.id]=numerar(acts)}});
        S.semanas=nuevas; listoSem=true; fin(); if(S.cargado)pintar();
      },e=>this.errorEscucha(e));
      setTimeout(()=>{listoDoc=listoSem=true;fin()},15000);
    });
  },
  errorEscucha(e){S.estado={tipo:'err',texto:'Sin conexión con los datos guardados'};pintarBarra()},
  limpiarSemanas(obj){const r={};if(obj&&typeof obj==='object')for(const k of Object.keys(obj)){const f=deClave(k);if(!f||f.getDay()!==1)continue;const lista=Array.isArray(obj[k])?obj[k]:(obj[k]&&obj[k].actividades);if(!Array.isArray(lista))continue;const acts=lista.map(limpiarActividad).filter(Boolean);if(acts.length)r[k]=numerar(acts)}return r},
  textoGuardado(){return this.modo==='local'?(this.independiente?'Guardado automáticamente en este dispositivo':'Guardado automáticamente en este navegador'):'Guardado automáticamente'},
  async escribir(fn){
    if(!S.cargado)return false;              /* nunca guardar antes de la carga inicial */
    if(this.modo==='memoria'){S.estado={tipo:'warn',texto:'Datos disponibles durante esta sesión'};pintarBarra();return true}
    S.estado={tipo:'info',texto:'Guardando…'};pintarBarra();
    try{
      await fn();
      S.estado={tipo:'ok',texto:this.textoGuardado()};
      pintarBarra();return true;
    }catch(e){
      if(e&&e.code==='invalid_argument'&&this.modo==='db'){S.puedeEditar=false;S.vista='presentacion'}
      S.estado={tipo:'err',texto:'Cambios sin guardar'+(e&&e.code==='invalid_argument'?': no tienes permiso para editar':e&&e.code==='quota_exceeded'?': almacenamiento lleno':'. Exporta un respaldo')};
      pintar();return false;
    }
  },
  guardarLocal(){localStorage.setItem(LS_CLAVE,JSON.stringify({formato:FORMATO,version:VERSION_FORMATO,documento:S.doc,semanas:S.semanas}))},
  async escribirSemana(clave){
    const acts=numerar(actsDe(clave));
    if(this.modo==='db'){const ref=this.db.doc('semanas/'+clave);if(acts.length)await ref.set({version:VERSION_FORMATO,lunes:clave,actividades:acts.map(a=>({...a,operarios:[...a.operarios]}))});else await ref.delete()}
    else if(this.modo==='local')this.guardarLocal();
  },
  guardarSemana(clave){if(!actsDe(clave).length)delete S.semanas[clave];return this.escribir(()=>this.escribirSemana(clave))},
  guardarDocumento(){return this.escribir(async()=>{if(this.modo==='db')await this.db.doc('config/documento').set({...S.doc});else if(this.modo==='local')this.guardarLocal()})},
  guardarVarias(claves,conDoc){return this.escribir(async()=>{
    if(this.modo==='db'){for(const k of claves)await this.escribirSemana(k);if(conDoc)await this.db.doc('config/documento').set({...S.doc})}
    else if(this.modo==='local')this.guardarLocal()})},
  respaldo(){return{formato:FORMATO,version:VERSION_FORMATO,exportado:new Date().toISOString(),documento:{...S.doc},
    semanas:Object.fromEntries(Object.keys(S.semanas).sort().map(k=>[k,{actividades:numerar(S.semanas[k]).map(a=>({...a,operarios:[...a.operarios]}))}]))}},
  /* Valida la estructura de un respaldo. Devuelve {ok, datos|error} */
  validarRespaldo(txt){
    let d;try{d=JSON.parse(txt)}catch(e){return{ok:false,error:'El archivo no es un JSON válido.'}}
    if(!d||d.formato!==FORMATO)return{ok:false,error:'El archivo no es un respaldo de este cronograma.'};
    if(typeof d.version!=='number'||d.version>VERSION_FORMATO)return{ok:false,error:'La versión del respaldo no es compatible (versión '+d.version+').'};
    if(!d.semanas||typeof d.semanas!=='object')return{ok:false,error:'El respaldo no contiene semanas.'};
    let descartadas=0,total=0;const sem={};
    for(const k of Object.keys(d.semanas)){const f=deClave(k);const lista=d.semanas[k]&&d.semanas[k].actividades;
      if(!f||f.getDay()!==1||!Array.isArray(lista)){descartadas++;continue}
      const acts=lista.map(limpiarActividad).filter(Boolean);descartadas+=lista.length-acts.length;total+=acts.length;
      if(acts.length)sem[k]=numerar(acts.map(a=>({...a,id:nuevoId()})));}
    return{ok:true,datos:{documento:limpiarDoc(d.documento),semanas:sem,total,descartadas}};
  },
  async descargar(nombre,contenido){
    if(!this.descargas){
      if(!this.independiente)return{ok:false,codigo:'unavailable'};
      try{const tipo=nombre.endsWith('.json')?'application/json':'text/html';const url=URL.createObjectURL(new Blob([contenido],{type:tipo+';charset=utf-8'}));
        const a=document.createElement('a');a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{ok:true}}
      catch(e){return{ok:false,codigo:'unavailable'}}
    }
    try{await this.descargas.save({filename:nombre,data:contenido});return{ok:true}}catch(e){return{ok:false,codigo:e&&e.code||'unavailable'}}
  }
};
</script>

<script>
/* ===== 4. Interfaz ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const plural=(n,uno,varios)=>`<b>${n}</b> ${n===1?uno:varios}`;

function textoHoras(a){if(a.inicio&&a.fin)return a.inicio+' – '+a.fin;if(a.inicio)return 'Desde '+a.inicio;if(a.fin)return 'Hasta '+a.fin;return ''}

/* Hoja del cronograma. Es la misma para la app, la vista de presentación y el PDF (edicion=false). */
function htmlHoja(edicion){
  const n=numDias(),lunes=S.lunes,clave=aClave(lunes),acts=actsDe(clave),hoyK=aClave(hoy());
  const visibles=acts.filter(a=>a.dia<n);
  const ocultas=acts.length-visibles.length;
  const campo=(id,k,ph,et)=>`<input class="campo" id="${id}" data-fk="${id}" data-campo="${k}" value="${esc(S.doc[k])}" placeholder="${esc(ph)}" aria-label="${esc(et)}"${k==='division'||k==='proyecto'?` size="${Math.max(6,S.doc[k].length+1)}"`:''}>`;
  const ident='Departamento de ingeniería';   /* subtítulo fijo, no editable */
  const jefes=new Set(visibles.map(a=>a.jefe.toLocaleLowerCase('es')).filter(Boolean));
  const ops=new Set(visibles.flatMap(a=>a.operarios.map(o=>o.toLocaleLowerCase('es'))));
  const porEstado=Object.keys(ESTADOS).map(k=>[k,visibles.filter(a=>a.estado===k).length]).filter(x=>x[1]);
  let cols='';
  for(let i=0;i<n;i++){
    const f=sumarDias(lunes,i),lista=acts.filter(a=>a.dia===i);
    const items=lista.map((a,j)=>{
      const h=textoHoras(a),hayResp=a.jefe||a.operarios.length;
      return `<li class="act">${a.jornada||h?`<p class="act-h">${a.jornada?`<span class="jor">${JORNADAS[a.jornada]}</span>`:''}${h?`<span>${esc(h)}</span>`:''}</p>`:''}
      <h3 class="act-t">${esc(a.titulo)}</h3>${a.descripcion.trim()?`<p class="act-d">${esc(a.descripcion.trim())}</p>`:''}
      ${hayResp?`<dl class="resp">${a.jefe?`<div><dt>Jefe inmediato</dt><dd class="jefe">${esc(a.jefe)}</dd></div>`:''}${a.operarios.length?`<div><dt>Operarios (${a.operarios.length})</dt><dd>${a.operarios.map(esc).join(', ')}</dd></div>`:''}</dl>`:''}
      <div class="act-tags">${a.etiqueta?`<span class="tag tag--${a.color}">${esc(a.etiqueta)}</span>`:''}<span class="st st--${a.estado}">${ESTADOS[a.estado]}</span></div>
      ${edicion?`<div class="act-ctl no-print">
        <button class="mini" data-acc="subir" data-id="${a.id}" data-fk="up-${a.id}" ${j===0?'disabled':''} aria-label="Subir «${esc(a.titulo)}»" title="Subir">↑</button>
        <button class="mini" data-acc="bajar" data-id="${a.id}" data-fk="dn-${a.id}" ${j===lista.length-1?'disabled':''} aria-label="Bajar «${esc(a.titulo)}»" title="Bajar">↓</button>
        <button class="mini" data-acc="editar" data-id="${a.id}" data-fk="ed-${a.id}" aria-label="Editar «${esc(a.titulo)}»">Editar</button>
        <button class="mini del" data-acc="eliminar" data-id="${a.id}" data-fk="el-${a.id}" aria-label="Eliminar «${esc(a.titulo)}»">Eliminar</button></div>`:''}</li>`}).join('');
    cols+=`<section class="col" id="dia-${i}" aria-labelledby="dh-${i}"><header class="dh${edicion&&aClave(f)===hoyK?' hoy':''}" id="dh-${i}"><span class="dn">${DIAS[i]}</span><span class="dd">${textoCorto(f)}</span></header>
      ${lista.length?`<ol class="acts">${items}</ol>`:`<div class="vacio">Sin actividades programadas</div>`}
      ${edicion?`<button class="add no-print" data-acc="agregar" data-dia="${i}" data-fk="add-${i}">+ Agregar actividad</button>`:''}</section>`;
  }
  return `<article class="hoja" aria-label="Cronograma semanal">
  <header class="cab">
    <div class="logos"><img class="logo-pe" src="${LOGO_PE}" alt="P. Electric S.A.S."><span class="sep" aria-hidden="true"></span><img class="logo-ss" src="${LOGO_SS}" alt="Solar Solutions"></div>
    <div class="titulos">
      <h1 class="t1">CRONOGRAMA SEMANAL</h1>
      <p class="t2">${ident}</p>
    </div>
    <dl class="ficha">
      <dt>Periodo</dt><dd>${esc(textoRango(lunes,n))}</dd>
      <dt>Emisión</dt><dd>${textoNum(hoy())}</dd>
      ${edicion?`<dt><label for="in-elaboro">Elaboró</label></dt><dd>${campo('in-elaboro','elaboro','Nombre y cargo','Elaboró')}</dd>`:S.doc.elaboro.trim()?`<dt>Elaboró</dt><dd>${esc(S.doc.elaboro)}</dd>`:''}
    </dl>
  </header>
  <div class="banda" aria-hidden="true"></div>
  <p class="resumen"><span>${plural(visibles.length,'actividad','actividades')}</span>${jefes.size?`<span>${plural(jefes.size,'jefe inmediato','jefes inmediatos')}</span>`:''}${ops.size?`<span>${plural(ops.size,'operario','operarios')}</span>`:''}<span class="sp"></span>${porEstado.map(([k,c])=>`<span class="st st--${k}">${ESTADOS[k]}: ${c}</span>`).join('')}</p>
  <div class="cuerpo">
  ${edicion&&ocultas?`<p class="oculto-sab no-print">Hay ${ocultas} actividad${ocultas>1?'es':''} del sábado oculta${ocultas>1?'s':''}. Activa «Incluir sábado» en Opciones para verla${ocultas>1?'s':''}.</p>`:''}
  <div class="rejilla-scroll"><div class="rejilla" style="--n:${n}">${cols}</div></div>
  </div>
  <footer class="pie"><span class="nota">${edicion?campo('in-nota','nota','Nota al pie (opcional)','Nota al pie del cronograma'):esc(S.doc.nota)}</span><span class="firma">P. Electric S.A.S. · Solar Solutions</span></footer>
</article>`;
}

function pintarBarra(){
  const ed=S.vista==='edicion'&&S.puedeEditar, lista=S.cargado, dis=lista?'':'disabled';
  const est=S.modo==='memoria'&&S.estado.tipo!=='err'?{tipo:'warn',texto:'Datos disponibles durante esta sesión'}:S.estado;
  const cls={ok:'ok',err:'err',warn:'warn'}[est.tipo]||'';
  const foco=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.fk;
  const enBarra=foco&&document.activeElement.closest('#barra,#sembar');
  $('#barra').innerHTML=`
    <div class="ab-marca"><span class="ab-t">Cronograma semanal</span><span class="estado ${cls}" role="status">${esc(est.texto)}</span></div>
    ${S.puedeEditar?`<div class="seg" role="group" aria-label="Modo de vista"><button data-acc="vista-ed" data-fk="vista-ed" aria-pressed="${S.vista==='edicion'}"><span class="txt-l">Vista de edición</span><span class="txt-c">Edición</span></button><button data-acc="vista-pr" data-fk="vista-pr" aria-pressed="${S.vista==='presentacion'}"><span class="txt-l">Vista de presentación</span><span class="txt-c">Presentación</span></button></div>`:`<span class="solo-lectura">Solo lectura</span>`}
    <button class="bb bb-pri" data-acc="imprimir" data-fk="imprimir" ${dis} aria-label="Imprimir o guardar como PDF"><span class="txt-l">Imprimir / Guardar como PDF</span><span class="txt-c">PDF</span></button>
    ${ed?`<button class="bb" data-acc="menu" data-fk="menu" aria-haspopup="true" aria-expanded="${S.menu}" ${dis}>Opciones</button>`:''}
    ${ed&&S.menu?`<div class="menu" role="group" aria-label="Opciones">
      <label><input type="checkbox" id="chk-sab" data-fk="chk-sab" ${S.doc.incluirSabado?'checked':''}> Incluir sábado</label><hr>
      <button data-acc="duplicar" data-fk="duplicar">Duplicar semana</button>
      <button data-acc="limpiar" data-fk="limpiar" class="pel">Limpiar semana</button><hr>
      <button data-acc="exportar" data-fk="exportar">Exportar respaldo</button>
      <button data-acc="importar" data-fk="importar">Importar respaldo</button>
    </div>`:''}`;
  const n=numDias(),hoyK=aClave(hoy()),acts=actsDe(claveActual());
  $('#sembar').innerHTML=`
    <div class="sem-nav" role="group" aria-label="Navegación semanal">
      <button class="bb" data-acc="sem-prev" data-fk="sem-prev" ${dis} aria-label="Semana anterior">←<span class="txt-l"> Semana anterior</span></button>
      <label class="campo-sem" for="sel-semana"><span class="et">Cambiar semana</span><input type="date" id="sel-semana" data-fk="sel-semana" value="${aClave(S.lunes)}" ${dis}></label>
      <button class="bb" data-acc="sem-next" data-fk="sem-next" ${dis} aria-label="Semana siguiente"><span class="txt-l">Semana siguiente </span>→</button>
      <button class="bb" data-acc="sem-hoy" data-fk="sem-hoy" ${dis} aria-label="Ir a esta semana"><span class="txt-l">Ir a esta semana</span><span class="txt-c">Hoy</span></button>
      ${S.avisoSemana?`<span class="aviso-sem txt-l" role="status">${esc(S.avisoSemana)}</span>`:''}
    </div>
    ${lista?`<nav class="dias-nav" aria-label="Ir a un día">${Array.from({length:n},(_,i)=>{const f=sumarDias(S.lunes,i),c=acts.filter(a=>a.dia===i).length;
      return `<button data-acc="ir-dia" data-dia="${i}" data-fk="ird-${i}" class="${aClave(f)===hoyK?'es-hoy':''}" aria-label="${DIAS_T[i]} ${f.getDate()}, ${c} actividad${c===1?'':'es'}"><span class="d1">${DIAS_C[i]}</span><span class="d2">${p2(f.getDate())}</span>${c?'<span class="hay"></span>':''}</button>`}).join('')}</nav>`:''}`;
  if(enBarra){const el=document.querySelector('#barra [data-fk="'+foco+'"],#sembar [data-fk="'+foco+'"]');if(el)el.focus()}
}

function pintarHoja(){
  if(!S.cargado)return;
  const a=document.activeElement, enHoja=a&&a.closest&&a.closest('#hoja-root'), fk=enHoja&&a.dataset.fk, esCampo=enHoja&&a.dataset.campo;
  const val=esCampo?a.value:null, sel=esCampo?[a.selectionStart,a.selectionEnd]:null;
  $('#hoja-root').innerHTML=htmlHoja(S.vista==='edicion'&&S.puedeEditar);
  if(fk){const el=$('#hoja-root [data-fk="'+fk+'"]');if(el){if(esCampo){el.value=val;try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}if(!el.disabled)el.focus();else{const alt=el.parentElement.querySelector('button:not([disabled])');alt&&alt.focus()}}}
}
function pintar(){pintarBarra();pintarHoja()}
function mensaje(txt,tipo){const m=$('#msg');m.innerHTML=txt?`<p class="msg${tipo==='err'?' err':''}">${txt}</p>`:'';clearTimeout(mensaje.t);if(txt)mensaje.t=setTimeout(()=>m.innerHTML='',10000)}

/* ----- Semanas ----- */
function irA(fecha,desdeSelector){
  const l=lunesDe(fecha);
  S.avisoSemana=desdeSelector&&fecha.getDay()!==1?'Se muestra la semana que inicia el lunes '+textoNum(l)+'.':'';
  S.lunes=l;pintar();
}

/* ----- Diálogos ----- */
let dlgPrevio=null, dlgAlCerrar=null, dlgSucio=()=>false;
function abrirDlg(html,{onCerrar,sucio}={}){
  dlgPrevio=document.activeElement; dlgAlCerrar=onCerrar||null; dlgSucio=sucio||(()=>false);
  $('#dlg-root').innerHTML=`<div class="velo"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">${html}</div></div>`;
  const f=$('#dlg-root [autofocus]')||$('#dlg-root input,#dlg-root select,#dlg-root textarea,#dlg-root button');f&&f.focus();
}
function cerrarDlg(){$('#dlg-root').innerHTML='';dlgAlCerrar&&dlgAlCerrar();dlgAlCerrar=null;dlgSucio=()=>false;if(dlgPrevio&&document.contains(dlgPrevio))dlgPrevio.focus();else{const el=dlgPrevio&&dlgPrevio.dataset&&dlgPrevio.dataset.fk&&$('[data-fk="'+dlgPrevio.dataset.fk+'"]');el&&el.focus()}}
function confirmar({titulo,texto,si='Confirmar',peligro=true}){
  return new Promise(res=>{
    let r=false;
    abrirDlg(`<header><h2 id="dlg-t">${esc(titulo)}</h2></header><div class="cuerpo">${texto}</div>
      <div class="pie-dlg"><button class="btn" data-dlg="no" autofocus>Cancelar</button><button class="btn ${peligro?'btn-pel':'btn-pri'}" data-dlg="si">${esc(si)}</button></div>`,{onCerrar:()=>res(r)});
    $('#dlg-root [data-dlg="si"]').onclick=()=>{r=true;cerrarDlg()};
    $('#dlg-root [data-dlg="no"]').onclick=()=>cerrarDlg();
  });
}
document.addEventListener('keydown',e=>{
  if(!$('#dlg-root').firstChild){if(e.key==='Escape'&&S.menu){S.menu=false;pintarBarra();const b=$('[data-fk="menu"]');b&&b.focus()}return}
  if(e.key==='Escape'){e.preventDefault();
    if(dlgSucio()){const b=$('#dlg-root .sucio');if(b){b.hidden=false;b.scrollIntoView({block:'nearest'});b.querySelector('button').focus()}}else cerrarDlg()}
  if(e.key==='Tab'){const fs=[...$('#dlg-root').querySelectorAll('button:not([disabled]),input,select,textarea')].filter(x=>x.offsetParent!==null);if(!fs.length)return;
    const a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

/* ----- Formulario de actividad ----- */
function formActividad(dia,act){
  const n=Math.max(numDias(),act&&act.dia===5?6:0);
  const v=act||{dia,titulo:'',jornada:'',inicio:'',fin:'',descripcion:'',jefe:'',operarios:[],etiqueta:'Ejecución',color:'azul',estado:'programado'};
  const usados=nombresUsados();
  let ops=[...v.operarios];
  const opDias=Array.from({length:n},(_,i)=>`<option value="${i}" ${v.dia===i?'selected':''}>${DIAS_T[i]} · ${textoCorto(sumarDias(S.lunes,i))}</option>`).join('');
  abrirDlg(`<form id="f-act" novalidate>
    <header><h2 id="dlg-t">${act?'Editar actividad':'Nueva actividad'}</h2></header>
    <div class="cuerpo">
      <div class="f"><label for="fa-tit">Actividad</label><input id="fa-tit" value="${esc(v.titulo)}" maxlength="200" required aria-describedby="fa-tit-err" autofocus><span class="error" id="fa-tit-err" aria-live="polite"></span></div>
      <div class="f"><label for="fa-desc">Descripción <span class="opc">(opcional)</span></label><textarea id="fa-desc" maxlength="2000">${esc(v.descripcion)}</textarea></div>

      <p class="grupo">Programación</p>
      <div class="f"><label for="fa-dia">Día</label><select id="fa-dia">${opDias}</select></div>
      <fieldset class="f"><legend>Jornada</legend><div class="pildoras">${JORNADAS_OP.map(([k,t],i)=>`<label><input type="radio" name="fa-jor" id="fa-jor-${i}" value="${k}" ${v.jornada===k?'checked':''}><span>${t}</span></label>`).join('')}</div></fieldset>
      <div class="dos">
        <div class="f"><label for="fa-ini">Hora de inicio <span class="opc">(opcional)</span></label><input type="time" id="fa-ini" value="${v.inicio}"></div>
        <div class="f"><label for="fa-fin">Hora de finalización <span class="opc">(opcional)</span></label><input type="time" id="fa-fin" value="${v.fin}" aria-describedby="fa-fin-err"><span class="error" id="fa-fin-err" aria-live="polite"></span></div>
      </div>
      <p class="ayuda nota-dlg">Puedes indicar solo la jornada, solo las horas o ambas.</p>

      <p class="grupo">Responsables</p>
      <div class="f"><label for="fa-jefe">Jefe inmediato <span class="opc">(ingeniero encargado)</span></label><input id="fa-jefe" value="${esc(v.jefe)}" maxlength="80" list="fa-jefe-l" autocomplete="off" placeholder="Nombre del ingeniero encargado"><datalist id="fa-jefe-l">${usados.jefes.map(j=>`<option value="${esc(j)}"></option>`).join('')}</datalist></div>
      <div class="f"><label for="fa-op">Operarios asignados <span class="opc">(opcional)</span></label>
        <div class="chips" id="fa-ops" aria-live="polite"></div>
        <div class="fila-op"><input id="fa-op" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="Nombre del operario"><button type="button" class="btn" id="fa-op-add">Añadir</button></div>
        <div class="suger" id="fa-op-sug"></div>
      </div>

      <p class="grupo">Seguimiento</p>
      <div class="tres">
        <div class="f"><label for="fa-etq">Fase <span class="opc">(opcional)</span></label><input id="fa-etq" value="${esc(v.etiqueta)}" maxlength="40" list="fa-etq-l"><datalist id="fa-etq-l"><option>Ejecución</option><option>Preparación</option><option>Montaje</option><option>Pruebas</option><option>Entrega</option></datalist></div>
        <div class="f"><label for="fa-col">Color de fase</label><select id="fa-col">${Object.entries(COLORES).map(([k,t])=>`<option value="${k}" ${v.color===k?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="f"><label for="fa-est">Estado</label><select id="fa-est">${Object.entries(ESTADOS).map(([k,t])=>`<option value="${k}" ${v.estado===k?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>
      <div class="sucio" hidden>Tienes cambios sin guardar. <button type="button" class="btn" data-dlg="seguir">Seguir editando</button><button type="button" class="btn btn-pel" data-dlg="descartar">Descartar cambios</button></div>
    </div>
    <div class="pie-dlg"><button type="button" class="btn" data-dlg="cancelar">Cancelar</button><button type="submit" class="btn btn-pri">Guardar actividad</button></div>
  </form>`,{sucio:()=>leer()!==inicial});
  const jornada=()=>{const r=$('#f-act input[name="fa-jor"]:checked');return r?r.value:''};
  const pintarOps=()=>{
    $('#fa-ops').innerHTML=ops.map((o,i)=>`<span class="chip">${esc(o)}<button type="button" data-quitar="${i}" aria-label="Quitar a ${esc(o)}">×</button></span>`).join('');
    const ya=new Set(ops.map(o=>o.toLocaleLowerCase('es')));
    const libres=usados.operarios.filter(o=>!ya.has(o.toLocaleLowerCase('es'))).slice(0,14);
    $('#fa-op-sug').innerHTML=libres.length?'<span>Usados antes:</span>'+libres.map(o=>`<button type="button" data-sug="${esc(o)}">+ ${esc(o)}</button>`).join(''):'';
  };
  const agregarOps=txt=>{const antes=ops.length;ops=limpiarNombres([...ops,...String(txt).split(/[,;\n]/)]);pintarOps();return ops.length>antes};
  const tomarEntrada=()=>{const i=$('#fa-op');if(i.value.trim()){agregarOps(i.value);i.value=''}};
  pintarOps();
  $('#fa-op-add').onclick=()=>{tomarEntrada();$('#fa-op').focus()};
  $('#fa-op').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();tomarEntrada()}});
  $('#fa-op').addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(/[,;\n]/.test(t)){e.preventDefault();agregarOps(t)}});
  $('#fa-ops').addEventListener('click',e=>{const b=e.target.closest('[data-quitar]');if(!b)return;ops.splice(+b.dataset.quitar,1);pintarOps();$('#fa-op').focus()});
  $('#fa-op-sug').addEventListener('click',e=>{const b=e.target.closest('[data-sug]');if(!b)return;agregarOps(b.dataset.sug);const sig=$('#fa-op-sug button');(sig||$('#fa-op')).focus()});
  const leer=()=>JSON.stringify([...['dia','ini','fin','tit','desc','jefe','op','etq','col','est'].map(k=>$('#fa-'+k).value),jornada(),ops]);
  const inicial=leer();
  $('#dlg-root [data-dlg="cancelar"]').onclick=cerrarDlg;
  $('#dlg-root [data-dlg="descartar"]').onclick=cerrarDlg;
  $('#dlg-root [data-dlg="seguir"]').onclick=()=>{$('#dlg-root .sucio').hidden=true;$('#fa-tit').focus()};
  $('#f-act').onsubmit=async e=>{
    e.preventDefault();
    const tit=$('#fa-tit'),ini=$('#fa-ini').value,fin=$('#fa-fin'),finV=fin.value;let ok=true;
    tit.setAttribute('aria-invalid','false');fin.setAttribute('aria-invalid','false');$('#fa-tit-err').textContent='';$('#fa-fin-err').textContent='';
    if(!tit.value.trim()){ok=false;tit.setAttribute('aria-invalid','true');$('#fa-tit-err').textContent='Escribe el nombre de la actividad.'}
    if(ini&&finV&&finV<=ini){ok=false;fin.setAttribute('aria-invalid','true');$('#fa-fin-err').textContent='La hora de finalización debe ser posterior a la de inicio ('+ini+').'}
    if(!ok){(tit.getAttribute('aria-invalid')==='true'?tit:fin).focus();return}
    tomarEntrada();
    const datos=limpiarActividad({id:act?act.id:nuevoId(),dia:+$('#fa-dia').value,titulo:tit.value,jornada:jornada(),inicio:ini,fin:finV,descripcion:$('#fa-desc').value,jefe:$('#fa-jefe').value,operarios:ops,etiqueta:$('#fa-etq').value,color:$('#fa-col').value,estado:$('#fa-est').value});
    const clave=claveActual(),lista=[...actsDe(clave)];
    if(act){const i=lista.findIndex(x=>x.id===act.id);
      if(i<0)lista.push(datos);else if(lista[i].dia===datos.dia)lista[i]=datos;else{lista.splice(i,1);lista.push(datos)}}  /* al cambiar de día queda al final */
    else lista.push(datos);
    S.semanas[clave]=numerar(lista);cerrarDlg();pintar();
    await Almacen.guardarSemana(clave);
  };
}

/* ----- Acciones ----- */
async function mover(id,paso){
  const clave=claveActual(),lista=[...actsDe(clave)],a=lista.find(x=>x.id===id);if(!a)return;
  const delDia=lista.filter(x=>x.dia===a.dia),j=delDia.indexOf(a),k=j+paso;if(k<0||k>=delDia.length)return;
  const i1=lista.indexOf(a),i2=lista.indexOf(delDia[k]);[lista[i1],lista[i2]]=[lista[i2],lista[i1]];
  S.semanas[clave]=numerar(lista);pintarHoja();await Almacen.guardarSemana(clave);
}
async function eliminar(id){
  const clave=claveActual(),a=actsDe(clave).find(x=>x.id===id);if(!a)return;
  if(!await confirmar({titulo:'Eliminar actividad',texto:`<p>Se eliminará «<b>${esc(a.titulo)}</b>» del ${DIAS_T[a.dia].toLowerCase()} ${textoNum(sumarDias(S.lunes,a.dia))}. Esta acción no se puede deshacer.</p>`,si:'Eliminar'}))return;
  S.semanas[clave]=numerar(actsDe(clave).filter(x=>x.id!==id));pintar();await Almacen.guardarSemana(clave);
}
async function limpiarSemana(){
  const clave=claveActual(),n=actsDe(clave).length;
  if(!n){mensaje('Esta semana no tiene actividades para limpiar.');return}
  if(!await confirmar({titulo:'Limpiar semana',texto:`<p>Se eliminarán las <b>${n}</b> actividades de la ${esc(textoRango(S.lunes,numDias()).replace('Semana','semana'))}.</p><p class="nota-dlg">Las demás semanas y los datos del encabezado no cambian.</p>`,si:'Limpiar semana'}))return;
  delete S.semanas[clave];pintar();await Almacen.guardarSemana(clave);
}
function duplicarSemana(){
  const origen=claveActual(),acts=actsDe(origen);
  if(!acts.length){mensaje('Esta semana no tiene actividades para duplicar.');return}
  const sug=aClave(sumarDias(S.lunes,7));
  abrirDlg(`<form id="f-dup" novalidate><header><h2 id="dlg-t">Duplicar semana</h2></header><div class="cuerpo">
    <p>Se copiarán ${acts.length} actividades de la ${esc(textoRango(S.lunes,numDias()).replace('Semana','semana'))}, con su día, orden, jornada y responsables.</p>
    <div class="f"><label for="fd-fecha">Semana de destino</label><input type="date" id="fd-fecha" value="${sug}" aria-describedby="fd-info"><span class="nota-dlg" id="fd-info"></span></div>
    <label class="chk" id="fd-conf-l" hidden><input type="checkbox" id="fd-conf"> Sí, reemplazar las actividades de la semana de destino</label>
  </div><div class="pie-dlg"><button type="button" class="btn" data-dlg="cancelar">Cancelar</button><button type="submit" class="btn btn-pri" id="fd-ok">Duplicar</button></div></form>`);
  const act=()=>{
    const f=deClave($('#fd-fecha').value),info=$('#fd-info'),conf=$('#fd-conf-l'),ok=$('#fd-ok');
    if(!f){info.textContent='Elige una fecha.';info.className='error';conf.hidden=true;ok.disabled=true;return null}
    const l=lunesDe(f),k=aClave(l);
    if(k===origen){info.textContent='Elige una semana distinta a la actual.';info.className='error';conf.hidden=true;ok.disabled=true;return null}
    const exist=actsDe(k).length;
    info.className=exist?'error':'nota-dlg';
    info.textContent=textoRango(l,numDias())+(f.getDay()!==1?' (se usa el lunes de esa semana)':'')+(exist?'. Ya tiene '+exist+' actividades: se reemplazarán.':'.');
    conf.hidden=!exist;ok.disabled=!!exist&&!$('#fd-conf').checked;ok.textContent=exist?'Reemplazar y duplicar':'Duplicar';
    return k;
  };
  $('#fd-fecha').oninput=act;$('#fd-conf').onchange=act;act();
  $('#dlg-root [data-dlg="cancelar"]').onclick=cerrarDlg;
  $('#f-dup').onsubmit=async e=>{e.preventDefault();const k=act();if(!k||$('#fd-ok').disabled)return;
    S.semanas[k]=numerar(acts.map(a=>({...a,operarios:[...a.operarios],id:nuevoId()})));cerrarDlg();
    const ok=await Almacen.guardarSemana(k);
    if(ok)mensaje(`Semana copiada al ${esc(textoNum(deClave(k)))}. <button class="btn btn-txt" data-acc="ir-clave" data-clave="${k}">Ver semana copiada</button>`);};
}
async function exportar(){
  const txt=JSON.stringify(Almacen.respaldo(),null,2),nombre='respaldo-cronograma-'+aClave(hoy())+'.json';
  const r=await Almacen.descargar(nombre,txt);
  if(r.ok){mensaje('Respaldo listo: '+esc(nombre)+'.');return}
  if(r.codigo==='declined')return;
  abrirDlg(`<header><h2 id="dlg-t">Exportar respaldo</h2></header><div class="cuerpo"><p>La descarga no está disponible en esta vista. Copia el contenido y guárdalo como <b>${esc(nombre)}</b>.</p>
    <div class="f"><label for="ex-txt">Respaldo (JSON)</label><textarea id="ex-txt" class="json" readonly>${esc(txt)}</textarea></div></div>
    <div class="pie-dlg"><button class="btn" data-dlg="cerrar">Cerrar</button><button class="btn btn-pri" data-dlg="copiar">Copiar</button></div>`);
  $('#dlg-root [data-dlg="cerrar"]').onclick=cerrarDlg;
  $('#dlg-root [data-dlg="copiar"]').onclick=async e=>{const t=$('#ex-txt');try{await navigator.clipboard.writeText(t.value);e.target.textContent='Copiado'}catch(err){t.focus();t.select();e.target.textContent='Selecciona y copia'}};
}
$('#archivo-import').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    const r=Almacen.validarRespaldo(String(rd.result));
    if(!r.ok){mensaje('No se importó el respaldo. '+esc(r.error),'err');return}
    const claves=Object.keys(r.datos.semanas).sort(),coinciden=claves.filter(k=>actsDe(k).length);
    const txt=`<p>El archivo contiene <b>${claves.length}</b> semanas y <b>${r.datos.total}</b> actividades${r.datos.descartadas?` (se omitirán ${r.datos.descartadas} registros no válidos)`:''}.</p>
      ${coinciden.length?`<p>Se reemplazarán <b>${coinciden.length}</b> semanas que ya tienen actividades: ${coinciden.slice(0,6).map(k=>textoNum(deClave(k))).join(', ')}${coinciden.length>6?'…':''}.</p>`:''}
      <p class="nota-dlg">También se actualizarán los datos del encabezado. Las semanas que no están en el archivo se conservan.</p>`;
    if(!await confirmar({titulo:'Importar respaldo',texto:txt,si:'Importar',peligro:coinciden.length>0}))return;
    claves.forEach(k=>S.semanas[k]=r.datos.semanas[k]);S.doc=r.datos.documento;pintar();
    if(await Almacen.guardarVarias(claves,true))mensaje('Respaldo importado: '+claves.length+' semanas.');
  };
  rd.onerror=()=>mensaje('No se pudo leer el archivo.','err');
  rd.readAsText(file);
});
async function imprimir(){
  if(Almacen.independiente){const v=S.vista;S.vista='presentacion';S.menu=false;pintar();setTimeout(()=>{window.print();S.vista=v;pintar()},80);return}
  const n=numDias(),css=$('#sheet-css').textContent,nombre='cronograma-'+aClave(S.lunes)+'.html';
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronograma semanal ${textoNum(S.lunes)} al ${textoNum(sumarDias(S.lunes,n-1))}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>${css}
body{margin:0;background:#e9ecf3;font-family:"Source Sans 3",Arial,sans-serif}
.envoltura{max-width:1300px;margin:0 auto;padding:16px}
.guia{background:#1b244f;border-radius:6px;padding:10px 14px;margin:0 0 14px;color:#fff;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.guia button{font:inherit;font-weight:700;background:#f5b00e;color:#1b244f;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
@media print{.guia{display:none}.envoltura{padding:0;max-width:none}}
</style></head><body><div class="envoltura">
<div class="guia"><button onclick="window.print()">Imprimir / Guardar como PDF</button><span>En el diálogo elige <b>Guardar como PDF</b>, orientación <b>Horizontal</b> y papel <b>A4</b>.</span></div>
${htmlHoja(false)}</div></body></html>`;
  const r=await Almacen.descargar(nombre,html);
  if(r.ok){mensaje('Se descargó <b>'+esc(nombre)+'</b>. Ábrelo en tu navegador y pulsa «Imprimir / Guardar como PDF».');return}
  if(r.codigo==='declined')return;
  mensaje('La descarga no está disponible en esta vista. Usa la app instalada para generar el PDF directamente.','err');
}
function irDia(i){
  const el=document.getElementById('dia-'+i);if(!el)return;
  const suave=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  el.scrollIntoView({behavior:suave?'smooth':'auto',block:'start'});
}

/* ----- Eventos ----- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-acc]');
  if(S.menu&&!e.target.closest('.menu')&&!(b&&b.dataset.acc==='menu')){S.menu=false;pintarBarra()}
  if(!b||b.disabled)return;
  const acc=b.dataset.acc;
  if(acc==='menu'){S.menu=!S.menu;pintarBarra();if(S.menu){const p=$('.menu input,.menu button');p&&p.focus()}return}
  if(S.menu&&acc!=='ir-dia'){S.menu=false;pintarBarra()}
  if(acc==='sem-prev')irA(sumarDias(S.lunes,-7));
  else if(acc==='sem-next')irA(sumarDias(S.lunes,7));
  else if(acc==='sem-hoy')irA(hoy());
  else if(acc==='ir-dia')irDia(b.dataset.dia);
  else if(acc==='ir-clave'){irA(deClave(b.dataset.clave));mensaje('')}
  else if(acc==='vista-ed'){S.vista='edicion';pintar()}
  else if(acc==='vista-pr'){S.vista='presentacion';pintar()}
  else if(acc==='imprimir'){if(S.cargado)imprimir()}
  else if(!S.puedeEditar||!S.cargado)return;
  else if(acc==='agregar')formActividad(+b.dataset.dia,null);
  else if(acc==='editar'){const a=actsDe(claveActual()).find(x=>x.id===b.dataset.id);a&&formActividad(a.dia,a)}
  else if(acc==='subir')mover(b.dataset.id,-1);
  else if(acc==='bajar')mover(b.dataset.id,1);
  else if(acc==='eliminar')eliminar(b.dataset.id);
  else if(acc==='duplicar')duplicarSemana();
  else if(acc==='limpiar')limpiarSemana();
  else if(acc==='exportar')exportar();
  else if(acc==='importar')$('#archivo-import').click();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='sel-semana'){const f=deClave(t.value);if(f)irA(f,true)}
  else if(t.id==='chk-sab'&&S.puedeEditar){S.doc.incluirSabado=t.checked;pintar();await Almacen.guardarDocumento()}
  else if(t.dataset.campo&&S.puedeEditar){const v=t.value.trim();if(S.doc[t.dataset.campo]===v)return;S.doc[t.dataset.campo]=v;await Almacen.guardarDocumento()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute('size')&&t.dataset.campo)t.size=Math.max(6,t.value.length+1)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.campo){e.preventDefault();e.target.blur()}});

/* ----- Arranque: no se guarda nada hasta terminar la carga inicial ----- */
(async function(){
  pintarBarra();
  await Almacen.iniciar();
  S.modo=Almacen.modo;
  if(!S.puedeEditar)S.vista='presentacion';
  S.estado=S.modo==='db'?{tipo:'ok',texto:'Datos sincronizados'}:S.modo==='local'?{tipo:'ok',texto:Almacen.independiente?'Datos guardados en este dispositivo':'Datos guardados en este navegador'}:{tipo:'warn',texto:'Datos disponibles durante esta sesión'};
  S.cargado=true;pintar();
})();
</script>
